<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%" style="background: #000000; font-family: 'Outfit', 'Inter', system-ui, sans-serif;">
  <defs>
    <!-- Intense Cyberpunk Gradients -->
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#d000ff" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="grid-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d000ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f3ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="glass-panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>

    <!-- Intense Glowing Filters -->
    <filter id="intense-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="grid-clip">
      <rect x="0" y="160" width="1000" height="200" />
    </clipPath>
  </defs>

  <style>
    /* CSS Keyframe Animations */
    @keyframes grid-scroll {
      0% { transform: translateY(0px); }
      100% { transform: translateY(30px); }
    }
    @keyframes floating {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes pulse-particle {
      0%, 100% { opacity: 0.15; transform: scale(0.8); }
      50% { opacity: 0.8; transform: scale(1.3); }
    }
    @keyframes wave-flow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -120; }
    }
    @keyframes neon-border {
      0%, 100% { stroke-opacity: 0.2; }
      50% { stroke-opacity: 0.6; }
    }
    @keyframes path-dash {
      to { stroke-dashoffset: 0; }
    }

    /* Cross-browser opacity fade cycles for subtitles (12s total loop) */
    @keyframes fade-sub1 {
      0%, 16.6% { opacity: 1; }
      20.6%, 96% { opacity: 0; }
    }
    @keyframes fade-sub2 {
      0%, 16.6% { opacity: 0; }
      20.6%, 33.3% { opacity: 1; }
      37.3%, 100% { opacity: 0; }
    }
    @keyframes fade-sub3 {
      0%, 33.3% { opacity: 0; }
      37.3%, 50% { opacity: 1; }
      54%, 100% { opacity: 0; }
    }
    @keyframes fade-sub4 {
      0%, 50% { opacity: 0; }
      54%, 66.6% { opacity: 1; }
      70.6%, 100% { opacity: 0; }
    }
    @keyframes fade-sub5 {
      0%, 66.6% { opacity: 0; }
      70.6%, 83.3% { opacity: 1; }
      87.3%, 100% { opacity: 0; }
    }
    @keyframes fade-sub6 {
      0%, 83.3% { opacity: 0; }
      87.3%, 97% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* Assigning classes */
    .floor-grid-h {
      stroke: url(#grid-fade);
      stroke-width: 1.5;
      animation: grid-scroll 1.2s linear infinite;
    }
    .floor-grid-v {
      stroke: url(#grid-fade);
      stroke-width: 1.5;
    }
    .floating-card {
      animation: floating 4s ease-in-out infinite;
    }
    .neon-pulse-border {
      animation: neon-border 3s ease-in-out infinite;
    }
    .particle-light {
      animation: pulse-particle 2s infinite;
    }
    .wave-line {
      stroke: url(#cyber-grad);
      stroke-dasharray: 6 12;
      animation: wave-flow 4s linear infinite;
    }

    /* Subtitle Styles */
    .sub-text {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 4px;
      opacity: 0;
    }
    .sub1 { animation: fade-sub1 12s linear infinite; fill: #00f3ff; }
    .sub2 { animation: fade-sub2 12s linear infinite; fill: #ff007f; }
    .sub3 { animation: fade-sub3 12s linear infinite; fill: #00ff66; }
    .sub4 { animation: fade-sub4 12s linear infinite; fill: #d000ff; }
    .sub5 { animation: fade-sub5 12s linear infinite; fill: #ffea00; }
    .sub6 { animation: fade-sub6 12s linear infinite; fill: #00f3ff; }
  </style>

  <!-- Solid Background -->
  <rect width="1000" height="360" fill="#000000" />

  <!-- Animated Particle Grid / Floating Dust -->
  <g>
    <circle cx="100" cy="50" r="1.5" fill="#00f3ff" class="particle-light" style="animation-delay: 0s;" />
    <circle cx="300" cy="80" r="1.2" fill="#ff007f" class="particle-light" style="animation-delay: 0.5s;" />
    <circle cx="500" cy="40" r="1.5" fill="#d000ff" class="particle-light" style="animation-delay: 1s;" />
    <circle cx="700" cy="90" r="1.2" fill="#00ff66" class="particle-light" style="animation-delay: 1.5s;" />
    <circle cx="900" cy="60" r="1.8" fill="#ffea00" class="particle-light" style="animation-delay: 0.2s;" />
    <circle cx="200" cy="120" r="1" fill="#fff" class="particle-light" style="animation-delay: 0.8s;" />
    <circle cx="400" cy="100" r="1.5" fill="#00f3ff" class="particle-light" style="animation-delay: 1.2s;" />
    <circle cx="600" cy="130" r="1.2" fill="#ff007f" class="particle-light" style="animation-delay: 0.3s;" />
    <circle cx="800" cy="110" r="1.5" fill="#d000ff" class="particle-light" style="animation-delay: 1.7s;" />
  </g>

  <!-- 3D Perspective Grid Floor -->
  <g clip-path="url(#grid-clip)">
    <rect x="0" y="160" width="1000" height="200" fill="#020105" opacity="0.8" />
    
    <!-- Horizontal Grid lines -->
    <g>
      <line x1="0" y1="160" x2="1000" y2="160" class="floor-grid-h" style="animation-delay: 0s;" />
      <line x1="0" y1="190" x2="1000" y2="190" class="floor-grid-h" style="animation-delay: -0.2s;" />
      <line x1="0" y1="220" x2="1000" y2="220" class="floor-grid-h" style="animation-delay: -0.4s;" />
      <line x1="0" y1="250" x2="1000" y2="250" class="floor-grid-h" style="animation-delay: -0.6s;" />
      <line x1="0" y1="280" x2="1000" y2="280" class="floor-grid-h" style="animation-delay: -0.8s;" />
      <line x1="0" y1="310" x2="1000" y2="310" class="floor-grid-h" style="animation-delay: -1s;" />
      <line x1="0" y1="340" x2="1000" y2="340" class="floor-grid-h" style="animation-delay: -1.2s;" />
    </g>

    <!-- Vertical Converging Lines -->
    <g>
      <line x1="500" y1="110" x2="-400" y2="360" class="floor-grid-v" />
      <line x1="500" y1="110" x2="-200" y2="360" class="floor-grid-v" />
      <line x1="500" y1="110" x2="0" y2="360" class="floor-grid-v" />
      <line x1="500" y1="110" x2="150" y2="360" class="floor-grid-v" />
      <line x1="500" y1="110" x2="280" y2="360" class="floor-grid-v" />
      <line x1="500" y1="110" x2="380" y2="360" class="floor-grid-v" />
      <line x1="500" y1="110" x2="450" y2="360" class="floor-grid-v" />
      <line x1="500" y1="110" x2="500" y2="360" class="floor-grid-v" />
      <line x1="500" y1="110" x2="550" y2="360" class="floor-grid-v" />
      <line x1="500" y1="110" x2="620" y2="360" class="floor-grid-v" />
      <line x1="500" y1="110" x2="720" y2="360" class="floor-grid-v" />
      <line x1="500" y1="110" x2="850" y2="360" class="floor-grid-v" />
      <line x1="500" y1="110" x2="1000" y2="360" class="floor-grid-v" />
      <line x1="500" y1="110" x2="1200" y2="360" class="floor-grid-v" />
      <line x1="500" y1="110" x2="1400" y2="360" class="floor-grid-v" />
    </g>

    <!-- Glowing Horizon boundary -->
    <line x1="0" y1="160" x2="1000" y2="160" stroke="#00f3ff" stroke-width="4" filter="url(#intense-glow)" opacity="0.75" />
    
    <!-- Moving Sine Wave at bottom -->
    <path d="M 0 160 Q 250 120 500 160 T 1000 160" fill="none" stroke-width="2" class="wave-line" />
  </g>

  <!-- Left Glassmorphic Dashboard Card -->
  <g class="floating-card" style="animation-delay: 0.2s;">
    <rect x="40" y="45" width="270" height="140" rx="14" fill="url(#glass-panel)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" backdrop-filter="blur(16px)" />
    <rect x="40" y="45" width="4" height="140" fill="#00f3ff" rx="2" filter="url(#subtle-glow)" />

    <!-- Terminal header -->
    <circle cx="65" cy="60" r="4" fill="#ff5f56" />
    <circle cx="77" cy="60" r="4" fill="#ffbd2e" />
    <circle cx="89" cy="60" r="4" fill="#27c93f" />

    <!-- Terminal contents -->
    <text x="60" y="90" fill="#a5b4fc" font-size="11" font-weight="700" letter-spacing="1">SYSTEMS // LOAD</text>
    <text x="60" y="112" fill="#ffffff" font-size="18" font-weight="800">100% ONLINE</text>
    <text x="60" y="136" fill="#888899" font-size="10" font-family="monospace">&gt; CORE: REACT // NEXT.JS</text>
    <text x="60" y="152" fill="#00f3ff" font-size="10" font-family="monospace">&gt; BACKEND: NODE // EXPRESS</text>
  </g>

  <!-- Right Glassmorphic Dashboard Card -->
  <g class="floating-card" style="animation-delay: 0.7s;">
    <rect x="690" y="45" width="270" height="140" rx="14" fill="url(#glass-panel)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" backdrop-filter="blur(16px)" />
    <rect x="956" y="45" width="4" height="140" fill="#ff007f" rx="2" filter="url(#subtle-glow)" />

    <!-- Dashboard Metric Grid -->
    <text x="715" y="72" fill="#ff007f" font-size="11" font-weight="700" letter-spacing="1" filter="url(#subtle-glow)">&gt; ALG_STREAM</text>
    
    <g transform="translate(715, 92)">
      <text x="0" y="10" fill="#ffffff" font-size="11" font-weight="700">Full Stack Space</text>
      <text x="150" y="10" fill="#00f3ff" font-size="11" font-family="monospace" font-weight="800">Active</text>
      <line x1="0" y1="18" x2="220" y2="18" stroke="#ffffff" stroke-opacity="0.08" />

      <text x="0" y="34" fill="#ffffff" font-size="11" font-weight="700">Backend Systems</text>
      <text x="150" y="34" fill="#ff007f" font-size="11" font-family="monospace" font-weight="800">Node // Express</text>
      <line x1="0" y1="42" x2="220" y2="42" stroke="#ffffff" stroke-opacity="0.08" />

      <text x="0" y="58" fill="#ffffff" font-size="11" font-weight="700">Database Mesh</text>
      <text x="150" y="58" fill="#00ff66" font-size="11" font-family="monospace" font-weight="800">SQL // NoSQL</text>
    </g>
  </g>

  <!-- Center Text Group (Vercel Style Typography) -->
  <g transform="translate(500, 215)" text-anchor="middle">
    <ellipse cx="0" cy="-20" rx="140" ry="12" fill="#d000ff" fill-opacity="0.15" filter="url(#intense-glow)" />
    <text y="-10" fill="url(#text-grad)" font-size="44" font-weight="900" letter-spacing="5" filter="url(#subtle-glow)">AKSHIT SHARMA</text>
    
    <!-- Opacity-faded Subtitle Loops (No clip-path translation, maximum browser compatibility) -->
    <g transform="translate(0, 20)">
      <text x="0" y="0" class="sub-text sub1">FULL STACK DEVELOPER</text>
      <text x="0" y="0" class="sub-text sub2">SYSTEM ARCHITECT</text>
      <text x="0" y="0" class="sub-text sub3">BACKEND ENGINEER</text>
      <text x="0" y="0" class="sub-text sub4">CREATIVE BUILDER</text>
      <text x="0" y="0" class="sub-text sub5">PROBLEM SOLVER</text>
      <text x="0" y="0" class="sub-text sub6">AKSHBUILDS.TECH</text>
    </g>
  </g>

  <!-- Premium Neon Outer Framing Border -->
  <rect x="15" y="15" width="970" height="330" fill="none" stroke="url(#cyber-grad)" stroke-width="2" class="neon-pulse-border" rx="14" />
  <rect x="20" y="20" width="960" height="320" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" rx="12" />
</svg>
