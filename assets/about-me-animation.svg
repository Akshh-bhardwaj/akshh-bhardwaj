<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%" style="background: transparent; font-family: 'Fira Code', 'Space Mono', monospace;">
  <defs>
    <!-- Cyan & Pink Glow filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
  </defs>

  <style>
    /* Blink animation for cursor */
    @keyframes cursor-blink {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
    /* Typing sequences */
    @keyframes code-type-1 {
      0%, 100% { width: 0ch; }
      15%, 85% { width: 23ch; }
    }
    @keyframes code-type-2 {
      0%, 20%, 100% { width: 0ch; }
      35%, 80% { width: 17ch; }
    }
    @keyframes code-type-3 {
      0%, 40%, 100% { width: 0ch; }
      55%, 75% { width: 21ch; }
    }
    /* Wave animation in bg */
    @keyframes wave-move {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -40; }
    }

    .cursor {
      animation: cursor-blink 1s step-end infinite;
      fill: #00f3ff;
    }
    .typing-line-1 {
      animation: code-type-1 8s steps(23) infinite;
      overflow: hidden;
      white-space: nowrap;
      display: inline-block;
    }
    .typing-line-2 {
      animation: code-type-2 8s steps(17) infinite;
      overflow: hidden;
      white-space: nowrap;
      display: inline-block;
    }
    .typing-line-3 {
      animation: code-type-3 8s steps(21) infinite;
      overflow: hidden;
      white-space: nowrap;
      display: inline-block;
    }
    .grid-wave {
      stroke: url(#cyber-grad);
      stroke-opacity: 0.15;
      stroke-dasharray: 4 6;
      animation: wave-move 3s linear infinite;
    }
  </style>

  <!-- Glassmorphic Terminal Panel -->
  <rect x="10" y="10" width="300" height="180" rx="12" fill="#000000" stroke="url(#cyber-grad)" stroke-width="1.5" />
  
  <!-- Terminal Top Bar -->
  <path d="M 10 22 L 10 22 Q 10 10 22 10 L 298 10 Q 310 10 310 22 L 310 36 L 10 36 Z" fill="#090514" />
  <circle cx="25" cy="23" r="3" fill="#ff5f56" />
  <circle cx="35" cy="23" r="3" fill="#ffbd2e" />
  <circle cx="45" cy="23" r="3" fill="#27c93f" />
  <text x="60" y="26" fill="#888" font-size="8" font-weight="700">akshit_sharma.sh</text>

  <!-- Background Data Flow Wave -->
  <path d="M 10 140 Q 90 100 170 140 T 310 140" fill="none" stroke-width="2" class="grid-wave" />

  <!-- Code Workspace -->
  <g transform="translate(25, 60)" font-size="11" font-weight="700">
    <!-- Line 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="10" fill="#ff007f" filter="url(#glow-pink)">&gt;</text>
      <!-- Typing: "Initializing Java VM..." -->
      <svg x="15" y="0" width="220" height="18">
        <text x="0" y="10" fill="#ffffff" class="typing-line-1">Initializing Java VM...</text>
      </svg>
    </g>

    <!-- Line 2 -->
    <g transform="translate(0, 22)">
      <text x="0" y="10" fill="#00f3ff" filter="url(#glow-cyan)">&gt;</text>
      <!-- Typing: "Compiling DSA.cpp" -->
      <svg x="15" y="0" width="220" height="18">
        <text x="0" y="10" fill="#ffffff" class="typing-line-2">Compiling DSA.cpp</text>
      </svg>
    </g>

    <!-- Line 3 -->
    <g transform="translate(0, 44)">
      <text x="0" y="10" fill="#ff007f" filter="url(#glow-pink)">&gt;</text>
      <!-- Typing: "Stack status: ACTIVE" -->
      <svg x="15" y="0" width="220" height="18">
        <text x="0" y="10" fill="#00f3ff" filter="url(#glow-cyan)" class="typing-line-3">Stack status: ACTIVE</text>
      </svg>
    </g>

    <!-- Blinking Cursor -->
    <!-- Positioned at the end of the text line coordinates -->
    <rect x="165" y="44" width="6" height="11" class="cursor" filter="url(#glow-cyan)">
      <animate attributeName="x" values="15; 15; 165; 165" keyTimes="0; 0.52; 0.55; 1" dur="8s" repeatCount="indefinite" />
      <animate attributeName="y" values="0; 22; 44; 44" keyTimes="0; 0.2; 0.55; 1" dur="8s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Frame Grid status -->
  <text x="25" y="170" fill="#444" font-size="8" font-weight="700">PORT: 3000 // NODE_ENV: PRODUCTION</text>
</svg>
