<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" style="background: transparent;">
  <defs>
    <!-- Cyberpunk Glows -->
    <filter id="glow-cyan" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-green" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="bar-grad-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff66" />
      <stop offset="100%" stop-color="#00f3ff" />
    </linearGradient>
    <linearGradient id="bar-grad-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#d000ff" />
    </linearGradient>
  </defs>

  <style>
    @keyframes bar-rise-1 {
      0%, 100% { height: 15px; y: 70px; }
      50% { height: 38px; y: 47px; }
    }
    @keyframes bar-rise-2 {
      0%, 100% { height: 42px; y: 43px; }
      50% { height: 18px; y: 67px; }
    }
    @keyframes bar-rise-3 {
      0%, 100% { height: 22px; y: 63px; }
      50% { height: 45px; y: 40px; }
    }
    @keyframes base-scan {
      0%, 100% { transform: scale(0.9); opacity: 0.2; }
      50% { transform: scale(1.1); opacity: 0.6; }
    }
    @keyframes data-flow {
      0% { stroke-dashoffset: 20; }
      100% { stroke-dashoffset: 0; }
    }
    .bar1 { animation: bar-rise-1 2.2s ease-in-out infinite; }
    .bar2 { animation: bar-rise-2 2.2s ease-in-out infinite; }
    .bar3 { animation: bar-rise-3 2.2s ease-in-out infinite; }
    .base-scanner { animation: base-scan 3s ease-in-out infinite; transform-origin: 60px 78px; }
    .flow-line { animation: data-flow 1.5s linear infinite; stroke-dasharray: 4 4; }
  </style>

  <!-- Isometric Base Grid -->
  <polygon points="60,65 95,78 60,91 25,78" fill="#080512" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />
  
  <!-- Base scanner circle -->
  <ellipse cx="60" cy="78" rx="20" ry="7.5" fill="none" stroke="#00f3ff" stroke-width="1.5" class="base-scanner" filter="url(#glow-cyan)" />

  <!-- Animated data stream paths connecting buildings -->
  <path d="M 41 72 L 60 48 L 79 66" fill="none" stroke="#00ff66" stroke-width="1" class="flow-line" filter="url(#glow-green)" />

  <!-- Isometric Building / Data Column 1 (Left) -->
  <g class="bar1">
    <rect x="35" y="70" width="12" height="15" fill="url(#bar-grad-1)" stroke="#00f3ff" stroke-width="1" filter="url(#glow-cyan)" />
    <!-- Side shade -->
    <path d="M 47 70 L 47 85 L 43 83 L 43 69 Z" fill="#020815" opacity="0.4" />
  </g>

  <!-- Isometric Building / Data Column 2 (Center) -->
  <g class="bar2">
    <rect x="54" y="43" width="12" height="42" fill="url(#bar-grad-2)" stroke="#ff007f" stroke-width="1" filter="url(#glow-cyan)" />
    <!-- Side shade -->
    <path d="M 66 43 L 66 85 L 62 83 L 62 42 Z" fill="#020815" opacity="0.4" />
  </g>

  <!-- Isometric Building / Data Column 3 (Right) -->
  <g class="bar3">
    <rect x="73" y="63" width="12" height="22" fill="url(#bar-grad-1)" stroke="#00ff66" stroke-width="1" filter="url(#glow-green)" />
    <!-- Side shade -->
    <path d="M 85 63 L 85 85 L 81 83 L 81 62 Z" fill="#020815" opacity="0.4" />
  </g>

  <!-- Floating satellite node -->
  <circle cx="60" cy="30" r="2" fill="#00ff66" filter="url(#glow-green)">
    <animate attributeName="cy" values="30; 25; 30" dur="2s" repeatCount="indefinite" />
  </circle>
  <line x1="60" y1="30" x2="60" y2="43" stroke="#00ff66" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="2 2" />
</svg>
